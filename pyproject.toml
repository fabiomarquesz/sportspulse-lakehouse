[project]
name = "sportspulse-lakehouse"
version = "0.1.0"
description = "End-to-End Medallion Lakehouse and Biosignal Telemetry Pipeline for Athlete Cardiorespiratory Analytics (SportDB)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Fabio Marques" }
]
dependencies = [
    "scipy>=1.11.0",
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.10.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/sportspulse"]
